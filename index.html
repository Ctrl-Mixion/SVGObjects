<div>
<h1> SVG Object Creation Practice</h1>
</div>

<div>
    <h2> Line </h2>
    <svg width="100" height="100">
     <line
        x1="20"
        y1="40"
        x2="40"
        y2="80"
        stroke="skyblue"
        stroke-width="5"
     />
        </svg>
</div>

<div>
    <h2> Rectangle </h2>
    <svg width="200" height="200">
     <rect
        x="20"
        y="40"
        width="200"
        height="100"
        stroke="lavender"
        stroke-width="5"
        fill= "rgb(200, 39, 245)"
     />
        </svg>
</div>

<div>
    <h2> Rounded Rectangle </h2>
    <svg width="250" height="250">
     <rect
        x="20"
        y="40"
        width="200"
        height="100"
        rx="40"
        ry="40"
        stroke="lavender"
        stroke-width="5"
        fill= "rgb(200, 39, 245)"
     />
        </svg>
</div>

<div>
    <h2> Circle </h2>
    <svg width="250" height="250">
     <circle
        cx="100"
        cy="100"
        r="50"
        stroke="yellow"
        stroke-width="5"
        fill="none"
     />
        </svg>
</div>
<div>
    <h2> Polygon (L) </h2>
    <svg width="300" height="300" viewBox="0 0 400 400">
     <polygon
        points="
        50,100
        50,200
        110,200
        110,180
        70,180
        70,100
        50,100
        "
        stroke="blue"
        stroke-width="5"
        fill="cyan"
     />
        </svg>
</div>
<div>
 <h2> Polygon (L) </h2>
 <style>
    polygon{
        stroke: blue;
        fill: aquamarine;
        stroke-width: 5px;
        stroke-dasharray: 20, 24;
        stroke-linecap:butt;
    }
 </style>
    <svg width="300" height="300" viewBox="0 0 400 400">
     <polygon
        points="
        50,100
        50,200
        110,200
        110,180
        70,180
        70,100
        50,100
        "
       
     />
        </svg>
</div>
<div>
 <h2> Circle Styling </h2>
 <style>
    circle{
        stroke: blue;
        fill: aquamarine;
        stroke-width:3px;
        stroke-dasharray: 13, 6;
        stroke-linecap:round;
    }
 </style>
    <svg width="300" height="300" viewBox="0 0 400 400">
     <circle
     cx="150"
     cy="150"
     r="50"
         
     />
        </svg>
</div>
<div>
 <h2> Circle Styling Part 2 </h2>
 <style>
    #secondCircle{
        stroke: #7a064a;
        fill: rgb(234, 203, 213);
        stroke-width:4px;
        stroke-dasharray: 0, 10, 15, 10;
        stroke-linecap:square;
    }
 </style>
    <svg width="300" height="300" viewBox="0 0 400 400">
     <circle
     id="secondCircle"
     cx="200"
     cy="200"
     r="100"
         
     />
        </svg>
</div>
<div>
    <h2> Rounded Rectangle Styling </h2>
    <svg width="250" height="250">
     <rect
         id="roundRectangle
        x="20"
        y="40"
        width="200"
        height="100"
        rx="40"
        ry="40"
        stroke="lavender"
        stroke-width="5"
        fill= "rgb(200, 39, 245)"
     />
        </svg>
</div>
